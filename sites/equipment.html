        /* ======== DESIGN TOKENS ======== */
        :root {
            --neon-blue: #00e5ff;
            --mag: #ff2bd6;
            --yel: #f9f002;
            --ice-white: #d7f8ff;
            --border-glow: rgba(0, 229, 255, 0.35);
            --cut-s: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        /* ======== BASE ======== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background-color: #02070c;
            background-image:
                radial-gradient(ellipse at 50% -15%, rgba(0, 229, 255, 0.22), transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(255, 43, 214, 0.16), transparent 45%),
                linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);

            background-attachment: fixed;
            color: var(--ice-white);
            font: 500 1.05rem 'Rajdhani', sans-serif;
        }

        /* scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
        }

        /* ======== LAYOUT ======== */
        .page {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            padding: 90px 32px 80px;
        }

        .back-link {
            position: fixed;
            top: 22px;
            left: 22px;
            z-index: 10;
            padding: 12px 18px;
            background: var(--neon-blue);
            color: #02070c;
            text-decoration: none;
            font: 700 0.8rem 'Share Tech Mono', monospace;
            letter-spacing: 0.1em;
            clip-path: var(--cut-s);
            transition: 0.2s;
        }

        .back-link:hover {
            background: #fff;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

            content: '';
            display: block;
            height: 2px;
            width: min(420px, 70%);
            margin: 24px auto 0;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--mag), transparent);

        .eyebrow {
            font: 0.8rem 'Share Tech Mono', monospace;

            color: var(--neon-blue);

            line-height: 1.5;
            font-size: 1.15rem;

        @media (max-width: 700px) {

            }
        }
    </style>
</head>

            /* ---------- rendering ---------- */
            const slug = item => item.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            const list = items => "<ul>" + items.map(item => `<li>${item}</li>`).join("") + "</ul>";
            const olist = items => "<ol>" + items.map(item => `<li>${item}</li>`).join("") + "</ol>";

            /* turn item names inside plain text into links to their cards */
            const nameRe = new RegExp(
                ITEMS.map(i => i.name).sort((a, b) => b.length - a.length)
                    .map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
            const bySlug = {};
            ITEMS.forEach(i => { bySlug[i.name] = slug(i); });
            const linkify = text => text.replace(nameRe, m => `<a href="#${bySlug[m]}">${m}</a>`);

            const goalTable = rows => `<table class="c-table">` +
                rows.map(([a, b]) => `<tr><td>${a}</td><td>${linkify(b)}</td></tr>`).join("") + `</table>`;
            const tierTable = tiers => `<table class="c-table">` +
                tiers.map(([meta, text], i) => `<tr><td>TIER ${["I", "II", "III"][i]}<span class="t-meta">${meta}</span></td><td>${text}</td></tr>`).join("") + `</table>`;

            function card(item) {
                const color = CATS[item.cat].color;
                const unlock = item.start ? "dostępny od startu" : `odblokowanie: poz. <b>${item.lvl}</b>`;
                return `
                    <article class="cursed-card" id="${slug(item)}" data-cat="${item.cat}" style="--accent:${color}">
                        <header>
                            <span class="c-icon">${item.icon}</span>
                            <div><h3>${item.name}</h3><div class="c-tagline">${item.tagline}</div></div>
                        </header>
                        <div class="c-body">
                        <p class="c-what">${item.what}</p>
                        <div class="c-cost"><label>CENA I LIMIT</label><b>${item.price}</b> za sztukę · limit <b>${item.max}</b> na kontrakt · ${unlock}</div>
                        <h4>JAK UŻYWAĆ</h4>${list(item.use)}
                        <h4>TIERY</h4>${tierTable(item.tiers)}
                        ${item.tip ? `<div class="c-tip">💡 ${item.tip}</div>` : ""}
                        </div>
                    </article>`;
            }

            function renderEquipment() {
                const counts = {};
                ITEMS.forEach(i => { counts[i.cat] = (counts[i.cat] || 0) + 1; });
                const chips = [`<button class="active" data-cat="all">WSZYSTKIE (${ITEMS.length})</button>`]
                    .concat(Object.keys(CATS).map(k => `<button data-cat="${k}">${CATS[k].label} (${counts[k]})</button>`)).join("");

                document.getElementById("equip-root").innerHTML = `
                    <div class="cursed-panel"><h2>JAK DZIAŁA SPRZĘT</h2>${list(BASICS)}</div>
                    <div class="cursed-panel"><h2>CZEGO POTRZEBUJESZ? WYBIERZ NARZĘDZIE</h2>${goalTable(GOALS)}</div>
                    <div class="cursed-panel"><h2>SUGEROWANA KOLEJNOŚĆ ZAKUPÓW</h2>${olist(ORDER)}</div>
                    <nav class="filters" id="filters">${chips}</nav>
                    <div class="cursed-grid">${ITEMS.map(card).join("")}</div>
                    <p class="cursed-note">Źródła: wiki Phasmophobia (Fandom) oraz poradniki społeczności. Ceny, poziomy i statystyki tierów mogą zmieniać się z aktualizacjami gry, więc sprawdzaj je w praktyce.</p>`;

                const buttons = document.querySelectorAll("#filters button");
                const cards = document.querySelectorAll(".cursed-card");
                function applyFilter(cat) {
                    buttons.forEach(b => b.classList.toggle("active", b.dataset.cat === cat));
                    cards.forEach(c => c.classList.toggle("is-hidden", cat !== "all" && c.dataset.cat !== cat));
                }
                buttons.forEach(b => b.addEventListener("click", () => applyFilter(b.dataset.cat)));

                /* links from the tables above: make sure the target card is visible, then jump to it */
                document.querySelectorAll(".c-table a, .cursed-panel a").forEach(a => {
                    a.addEventListener("click", () => applyFilter("all"));
                });
            }
            renderEquipment();
        })();
