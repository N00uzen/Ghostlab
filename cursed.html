    <script>
        /* First visit in this tab: play intro.html, which always continues to index.html when it is done.
           intro.html sets "gl-intro-seen" right before it leaves, so this never loops. */
        (function () {
            try {
                if (sessionStorage.getItem("gl-intro-seen")) return;           // intro already played in this tab
                sessionStorage.setItem("gl-storage-test", "1");                // if storage is blocked this throws -> no redirect (no loop)
                sessionStorage.removeItem("gl-storage-test");
                document.documentElement.style.visibility = "hidden";          // no flash of the page before the redirect
                location.replace("intro.html");
            } catch (error) { /* storage blocked: just show the page */ }
        })();
    </script>

        * {

            margin: 0;
            padding: 0;
        }

        html {

        }

            background-attachment: fixed;
            color: var(--ice-white);
            font: 500 1.05rem 'Rajdhani', sans-serif;

        /* scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);

            margin: 0 auto;
            padding: 90px 32px 80px;

            top: 22px;
            left: 22px;
            z-index: 10;
            padding: 12px 18px;
            background: var(--neon-blue);
            color: #02070c;
            text-decoration: none;
            font: 700 0.8rem 'Share Tech Mono', monospace;
            letter-spacing: 0.1em;
            clip-path: var(--cut-s);

        }

        .back-link:hover {
            background: #fff;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero::after {
            content: '';

            letter-spacing: 0.3em;
            color: var(--neon-blue);

            line-height: 1.5;
            font-size: 1.15rem;
            color: #9fd3de;
        }

            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .jump a {

            color: var(--ice-white);
            text-decoration: none;

            padding: 22px;
            background: rgba(2, 12, 18, 0.78);
            border: 1px solid rgba(0, 229, 255, 0.35);
            border-left: 4px solid var(--neon-blue);
        }

        .cursed-panel h2 {

            letter-spacing: 0.08em;

            padding: 22px;
            background: rgba(2, 12, 18, 0.82);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-left: 4px solid var(--accent);

        .cursed-card header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .c-icon {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            font-size: 1.6rem;
            border: 1px solid var(--accent);

            letter-spacing: 0.06em;
            color: #fff;
            text-shadow: 2px 0 var(--accent);

        .c-tagline {
            font: 0.78rem 'Share Tech Mono', monospace;
            letter-spacing: 0.1em;
            color: var(--accent);
        }

        .c-what {
            margin-bottom: 12px;
            line-height: 1.5;
            color: #e3f6fb;
        }

        .c-cost {
            margin-bottom: 14px;
            padding: 9px 12px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed var(--accent);
            font-size: 0.95rem;
        }

        .c-cost label,
        .cursed-card h4 {
            display: block;
            margin: 14px 0 6px;
            font: 0.72rem 'Share Tech Mono', monospace;
            letter-spacing: 0.18em;
            color: var(--accent);
        }

        .c-cost label {
            margin: 0 0 3px;
        }

        .cursed-card h4.danger {
            color: #ff4d6d;
        }

        .c-tip {
            margin-top: 14px;

            background: rgba(249, 240, 2, 0.07);
            border-left: 3px solid var(--yel);
            line-height: 1.45;
            color: #f5f3b0;

        .c-table {
            width: 100%;
            margin-top: 6px;
            border-collapse: collapse;
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .c-table td {
            padding: 6px 8px;

            vertical-align: top;
            color: #c4e6ee;
        }

        .c-table td:first-child {
            width: 34%;
            font-weight: 700;
            color: var(--accent, var(--neon-blue));
        }

        .cursed-note {
            margin-top: 26px;
            font: 0.75rem 'Share Tech Mono', monospace;
            line-height: 1.6;
            color: #5f97a4;
        }
    

        @media (max-width: 700px) {

        }
    </style>
</head>

                        <header>
                            <span class="c-icon">${item.icon}</span>
                            <div><h3>${item.name}</h3><div class="c-tagline">${item.tagline}</div></div>
                        </header>
                        <p class="c-what">${item.what}</p>
                        <div class="c-cost"><label>KOSZT SANITY</label>${item.cost}</div>
                        <h4>JAK UŻYWAĆ</h4>${list(item.use)}
                        <h4 class="danger">KIEDY ZACZYNA SIĘ CURSED HUNT</h4>${list(item.hunt)}
                        ${item.table ? `<h4>${item.name === "TAROT CARDS" ? "WSZYSTKIE KARTY" : "WSZYSTKIE ŻYCZENIA"}</h4>${table(item.table)}` : ""}
                        <div class="c-tip">💡 ${item.tip}</div>
                    </article>`;
            }

            function renderCursed() {
                document.getElementById("cursed-root").innerHTML = `
                    <nav class="jump">${ITEMS.map(item => `<a href="#${slug(item)}">${item.icon} ${item.name}</a>`).join("")}</nav>
                    <div class="cursed-panel"><h2>JAK DZIAŁAJĄ PRZEKLĘTE PRZEDMIOTY</h2>${list(BASICS)}</div>
                    <div class="cursed-panel"><h2>CZEGO POTRZEBUJESZ? WYBIERZ PRZEDMIOT</h2>${table(GOALS)}</div>
                    <div class="cursed-grid">${ITEMS.map(card).join("")}</div>
                    <p class="cursed-note">Źródła: wiki Phasmophobia (Fandom) oraz poradniki GameSpot i społeczności. Wartości mogą zmieniać się z aktualizacjami gry, więc sprawdzaj je w praktyce.</p>`;
            }
            renderCursed();
        })();
    </script>
</body>
</html>
