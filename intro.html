    <style>
        /* Smooth cross-fade into the next page (supported browsers) */
        @view-transition {
            navigation: auto;
        }

        /* ======== DESIGN TOKENS ======== */
        :root {
            --neon-blue: #00e5ff;
            --mag: #ff2bd6;
            --yel: #f9f002;
            --ice-white: #d7f8ff;
            --lavender: #d2afff;
            --void: #02070c;
        }

        /* ======== BASE ======== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--void);
            color: var(--ice-white);
            font-family: 'Share Tech Mono', monospace;
            cursor: default;
        }

        body {
            background-image:
                radial-gradient(ellipse at 50% 40%, rgba(0, 229, 255, 0.16), transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(255, 43, 214, 0.14), transparent 45%),
                linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
        }

        /* scanlines + vignette */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.25) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.7));
        }

        .stage {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
        }

        /* ======== PHASE 1: BOOT TERMINAL ======== */
        .terminal {
            width: min(600px, 88vw);
            transition: opacity 0.5s;
        }

        .terminal-head {
            margin-bottom: 14px;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--neon-blue);
        }

        #boot-log {
            min-height: 150px;
            font-size: clamp(0.8rem, 2.4vw, 1rem);
            line-height: 1.9;
            color: #9fd3de;
        }

        #boot-log .ok {
            color: var(--yel);
        }

        #boot-log .cursor::after {
            content: '█';
            margin-left: 4px;
            color: var(--neon-blue);
            animation: blink 0.8s steps(2) infinite;
        }

        .progress {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 16px;
        }

        .bar {
            flex: 1;
            height: 8px;
            border: 1px solid rgba(0, 229, 255, 0.5);
            background: rgba(0, 229, 255, 0.08);
        }

        .bar i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--mag), var(--neon-blue));
            box-shadow: 0 0 14px var(--neon-blue);
        }

        #percent {
            min-width: 48px;
            text-align: right;
            color: var(--yel);
        }

        /* ======== PHASE 2: LOGO ======== */
        .logo {
            position: absolute;
            display: grid;
            justify-items: center;
            gap: 10px;
            opacity: 0;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: 10%;
            width: 520px;
            height: 520px;
            max-width: 90vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.28), transparent 65%);
            animation: pulse 2.4s ease-in-out infinite;
        }

        .ghost {
            position: relative;
            width: clamp(170px, 30vh, 260px);
            overflow: visible;
            animation: float 2.6s ease-in-out infinite;
        }

        .ghost .echo {
            fill: var(--mag);
            opacity: 0;
            animation: echo 3.2s steps(1) infinite;
        }

        .ghost .eye {
            transform-box: fill-box;
            transform-origin: center;
            animation: blink-eye 3.6s infinite;
        }

        .title {
            position: relative;
            font: 900 clamp(2.4rem, 9vw, 5rem) 'Orbitron', sans-serif;
            letter-spacing: 0.12em;
            color: #fff;
            text-shadow: 4px 0 var(--mag), -4px 0 var(--neon-blue), 0 0 40px rgba(0, 229, 255, 0.5);
            animation: glitch 2.4s infinite;
        }

        .tagline {
            position: relative;
            font-size: 0.8rem;
            letter-spacing: 0.3em;
            color: var(--neon-blue);
        }

        /* ======== PHASE SWITCHING ======== */
        [data-phase="logo"] .terminal,
        [data-phase="exit"] .terminal {
            opacity: 0;
        }

        [data-phase="logo"] .logo {
            animation: logo-in 0.9s cubic-bezier(0.2, 1.3, 0.4, 1) forwards;
        }

        /* ======== PHASE 3: EXIT (zoom through the ghost, flash, fade to dark) ======== */
        [data-phase="exit"] .logo {
            animation: zoom-out 1s cubic-bezier(0.6, 0, 0.9, 0.4) forwards;
        }

        .flash {
            position: fixed;
            inset: 0;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            background: radial-gradient(circle, #fff 0%, var(--neon-blue) 40%, transparent 75%);
        }

        .curtain {
            position: fixed;
            inset: 0;
            z-index: 16;
            opacity: 0;
            pointer-events: none;
            background: var(--void);
        }

        [data-phase="exit"] .flash {
            animation: flash 1s ease-in forwards;
        }

        [data-phase="exit"] .curtain {
            animation: curtain 1s ease-in forwards;
        }


        /* ======== ANIMATIONS ======== */
        @keyframes blink {
            50% { opacity: 0; }
        }

        @keyframes logo-in {
            0%   { opacity: 0; transform: scale(0.5); filter: blur(10px); }
            60%  { opacity: 1; filter: blur(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes zoom-out {
            0%   { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0.2; transform: scale(14); filter: blur(6px); }
        }

        @keyframes flash {
            0%, 35% { opacity: 0; }
            65%     { opacity: 0.85; }
            100%    { opacity: 0.85; }
        }

        @keyframes curtain {
            0%, 55% { opacity: 0; }
            100%    { opacity: 1; }
        }

        @keyframes float {
            50% { transform: translateY(-14px); }
        }

        @keyframes pulse {
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        @keyframes blink-eye {
            0%, 92%, 100% { transform: scaleY(1); }
            95%           { transform: scaleY(0.1); }
        }

        @keyframes echo {
            0%, 88%, 100% { opacity: 0; transform: translate(0, 0); }
            90%           { opacity: 0.7; transform: translate(-14px, 3px); }
            94%           { opacity: 0.7; transform: translate(12px, -3px); }
        }

        @keyframes glitch {
            0%, 91%, 100% { transform: none; }
            92% { transform: translateX(-6px) skewX(10deg); text-shadow: -7px 0 var(--mag), 7px 0 var(--neon-blue); }
            94% { transform: translateX(6px) skewX(-8deg); }
            96% { transform: translateX(-2px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .ghost,
            .ghost .eye,
            .ghost .echo,
            .title,
            .logo::before {
                animation: none;
            }
        }
    </style>

    <script>
        "use strict";

        /* ==========================================================================
           SETTINGS
           ========================================================================== */

        const NEXT_PAGE = "index.html";        // the page the animation leads to

        const BOOT_LINES = [
            "> BOOTING GHOSTLAB CORE ............ OK",
            "> LOADING GHOST DATABASE ........... OK",
            "> CALIBRATING EMF / BOX / UV / DOTS . OK",
            "> SCANNING MAP ARCHIVE ............. OK",
            "> ACCESS GRANTED"
        ];

        const TYPE_SPEED = 11;                 // ms per character
        const LOGO_TIME = 2400;                // how long the logo stays on screen (ms)
        const EXIT_TIME = 1000;                // length of the zoom / flash / fade-out (ms)


        /* ==========================================================================
           HELPERS
           ========================================================================== */

        const $ = id => document.getElementById(id);
        const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
        const setPhase = name => { document.body.dataset.phase = name; };

        let leaving = false;                   // true once the exit has started (also stops the boot loop)


        /* ==========================================================================
           PHASE 1 - boot terminal types out line by line while the bar fills
           ========================================================================== */

        function setProgress(fraction) {
            const percent = Math.round(Math.min(1, fraction) * 100);
            $("bar-fill").style.width = percent + "%";
            $("percent").textContent = percent + "%";
        }

        async function runBoot() {
            const log = $("boot-log");

            for (let i = 0; i < BOOT_LINES.length; i++) {
                const line = document.createElement("div");
                line.className = "cursor";
                log.appendChild(line);

                const text = BOOT_LINES[i];
                for (let c = 1; c <= text.length; c++) {
                    if (leaving) return false;
                    line.textContent = text.slice(0, c);
                    setProgress((i + c / text.length) / BOOT_LINES.length);
                    await wait(TYPE_SPEED);
                }

                line.classList.remove("cursor");
                if (text.endsWith("OK")) line.innerHTML = text.slice(0, -2) + `<span class="ok">OK</span>`;
                await wait(120);
            }
            return !leaving;
        }


        /* ==========================================================================
           PHASE 3 - leave: zoom through the ghost, flash, fade to dark, open the site
           ========================================================================== */

        function leave(duration) {
            if (leaving) return;
            leaving = true;
            setPhase("exit");

            setTimeout(() => {
                try {
                    sessionStorage.setItem("gl-intro-seen", "1");          // the pages check this, so the intro plays once per tab
                } catch (error) { /* ignore */ }
                location.replace(NEXT_PAGE);                                // always index.html; replace = Back won't return to the intro
            }, duration);
        }


        /* ==========================================================================
           START
           ========================================================================== */

        async function run() {
            if (matchMedia("(prefers-reduced-motion: reduce)").matches) {   // no animation for these visitors
                setTimeout(() => leave(400), 600);
                return;
            }

            if (!(await runBoot())) return;      // stops only if the page is already leaving
            setPhase("logo");                    // phase 2
            await wait(LOGO_TIME);
            leave(EXIT_TIME);                    // phase 3
        }

        run();
    </script>
</body>
</html>
