<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <script>
         (function () {
                try {
                    if (sessionStorage.getItem("gl-intro-seen")) return;           // intro already played in this tab
                    sessionStorage.setItem("gl-storage-test", "1");                // if storage is blocked this throws -> no redirect (no loop)
                    sessionStorage.removeItem("gl-storage-test");
                    document.documentElement.style.visibility = "hidden";          // no flash of the page before the redirect
                    location.replace("intro.html");
                } catch (error) { /* storage blocked: just show the page */ }
            })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTLAB // MAPY</title>
    <link rel="icon" type="image/x-icon" href="./icons/ghostlab.ico">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        /* ======== DESIGN TOKENS ======== */
        :root {
            --neon-blue: #00e5ff;
            --mag: #ff2bd6;
            --yel: #f9f002;
            --ice-white: #d7f8ff;
            --border-glow: rgba(0, 229, 255, 0.35);
            --cut-s: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        /* ======== BASE ======== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        [hidden] {
            display: none !important;
        }

        body {
            min-height: 100vh;
            background-color: #02070c;
            background-image:
                radial-gradient(ellipse at 50% -15%, rgba(0, 229, 255, 0.22), transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(255, 43, 214, 0.16), transparent 45%),
                linear-gradient(rgba(0, 229, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.06) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
            background-attachment: fixed;
            color: var(--ice-white);
            font: 500 1.05rem 'Rajdhani', sans-serif;
        }

        /* scanlines */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px);
            mix-blend-mode: multiply;
        }

        /* ======== LAYOUT ======== */
        .page {
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
            padding: 90px 32px 80px;
        }

        .back-link {
            position: fixed;
            top: 22px;
            left: 22px;
            z-index: 10;
            padding: 12px 18px;
            background: var(--neon-blue);
            color: #02070c;
            text-decoration: none;
            font: 700 0.8rem 'Share Tech Mono', monospace;
            letter-spacing: 0.1em;
            clip-path: var(--cut-s);
            transition: 0.2s;
        }

        .back-link:hover {
            background: #fff;
        }

        .hero {
            text-align: center;
            margin-bottom: 36px;
        }

        .hero::after {
            content: '';
            display: block;
            height: 2px;
            width: min(420px, 70%);
            margin: 24px auto 0;
            background: linear-gradient(90deg, transparent, var(--neon-blue), var(--mag), transparent);
        }

        .eyebrow {
            font: 0.8rem 'Share Tech Mono', monospace;
            letter-spacing: 0.3em;
            color: var(--neon-blue);
        }

        .hero h1 {
            margin: 14px 0;
            font: 900 clamp(2.6rem, 9vw, 5.5rem) 'Orbitron', sans-serif;
            letter-spacing: 0.1em;
            line-height: 1.1;
            color: #fff;
            text-shadow: 4px 0 var(--mag), -4px 0 var(--neon-blue), 0 0 40px rgba(0, 229, 255, 0.5);
        }

        .hero p {
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.5;
            font-size: 1.15rem;
            color: #9fd3de;
        }

        /* ======== MAP PICKER ======== */
        .map-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 10px;
            margin-bottom: 28px;
            padding: 18px;
            background: rgba(2, 12, 18, 0.75);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--neon-blue);
        }

        .map-group-title {
            grid-column: 1 / -1;
            margin-top: 6px;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border-glow);
            font: 0.75rem 'Share Tech Mono', monospace;
            letter-spacing: 0.2em;
            color: var(--mag);
        }

        .map-group-title:first-child {
            margin-top: 0;
        }

        .map-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            background: transparent;
            border: 1px solid var(--border-glow);
            color: var(--ice-white);
            cursor: pointer;
            text-align: left;
            font: 700 0.85rem 'Share Tech Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            clip-path: var(--cut-s);
            transition: 0.2s;
        }

        .map-btn small {
            color: var(--mag);
            font-size: 0.75rem;
        }

        .map-btn:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .map-btn.active {
            background: var(--neon-blue);
            border-color: var(--neon-blue);
            color: #02070c;
        }

        .map-btn.active small {
            color: #02070c;
        }

        /* ======== VIEWER ======== */
        .viewer-panel {
            background: rgba(2, 12, 18, 0.75);
            border: 1px solid var(--border-glow);
            border-left: 4px solid var(--mag);
            padding: 18px;
        }

        .viewer-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .viewer-bar h2 {
            font: 900 1.4rem 'Orbitron', sans-serif;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-shadow: 2px 0 var(--mag), -2px 0 rgba(0, 229, 255, 0.6);
        }

        .viewer-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .viewer-tools button {
            padding: 9px 14px;
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            cursor: pointer;
            font: 700 0.78rem 'Share Tech Mono', monospace;
            letter-spacing: 0.08em;
            clip-path: var(--cut-s);
            transition: 0.2s;
        }

        .viewer-tools button:hover {
            background: var(--neon-blue);
            color: #02070c;
        }

        #zoom-label {
            min-width: 52px;
            text-align: center;
            font: 0.85rem 'Share Tech Mono', monospace;
            color: var(--yel);
        }

        .viewer {
            position: relative;
            height: min(78vh, 900px);
            min-height: 420px;
            overflow: hidden;
            background: #031017;
            border: 1px solid var(--border-glow);
            cursor: grab;
            touch-action: none;
        }

        .viewer.dragging {
            cursor: grabbing;
        }

        .viewer img {
            position: absolute;
            top: 0;
            left: 0;
            max-width: none;
            transform-origin: 0 0;
            user-select: none;
            -webkit-user-drag: none;
        }

        .viewer-message {
            position: absolute;
            inset: 0;
            display: grid;
            place-content: center;
            gap: 8px;
            padding: 24px;
            text-align: center;
            font: 1rem 'Share Tech Mono', monospace;
            line-height: 1.6;
            color: #6fa3b0;
        }

        .viewer-message em {
            font-size: 2.6rem;
            font-style: normal;
        }

        .viewer-message b {
            color: var(--yel);
        }

        .help {
            margin-top: 10px;
            font: 0.72rem 'Share Tech Mono', monospace;
            color: #5f97a4;
        }

        @media (max-width: 700px) {
            .page {
                padding: 80px 14px 60px;
            }
        }
    </style>
</head>

<body>
    <!-- If you rename the main page, change this link -->
    <a class="back-link" href="index.html">← POWRÓT DO GHOSTLAB</a>

    <main class="page">
        <header class="hero">
            <div class="eyebrow">[ MAP ARCHIVE // LAYOUT SCANS ]</div>
            <h1>MAPY</h1>
            <p>Wybierz mapę, aby zobaczyć cały jej układ. Scroll przybliża, przeciąganie przesuwa.</p>
        </header>

        <nav class="map-picker" id="map-picker" aria-label="Wybór mapy"></nav>

        <section class="viewer-panel">
            <div class="viewer-bar">
                <h2 id="map-title">Wybierz mapę</h2>
                <div class="viewer-tools">
                    <button id="zoom-out" title="Oddal (-)">−</button>
                    <span id="zoom-label">100%</span>
                    <button id="zoom-in" title="Przybliż (+)">+</button>
                    <button id="zoom-fit" title="Dopasuj do okna (0)">DOPASUJ</button>
                    <button id="fullscreen" title="Pełny ekran">⛶ PEŁNY EKRAN</button>
                    <button id="mini-send" title="Pokaż tę mapę w pływającym mini-odtwarzaczu na stronie głównej">⧉ MINI-ODTWARZACZ</button>
                </div>
            </div>

            <div class="viewer" id="viewer">
                <img id="map-image" alt="" hidden>
                <div class="viewer-message" id="viewer-message"><em>🗺️</em>Wybierz mapę z listy powyżej.</div>
            </div>

            <div class="help">← → zmiana mapy · + / − zoom · 0 dopasuj · scroll = zoom · przeciągnij = przesuń</div>
        </section>
    </main>

    <script>
        "use strict";

        /* ==========================================================================
           MAPS
           Put your pictures in a folder called "maps" next to this file and name
           them after the "file" value below, e.g.  maps/tanglewood.jpg
           (.jpg, .png, .webp and .jpeg all work). To add a map, add one line.
           ========================================================================== */

        const IMAGE_FOLDER = "./maps2/";
        const IMAGE_EXTENSIONS = ["jpg", "png", "webp", "jpeg"];

        const MAPS = [
            /* Small */
            { name: "6 Tanglewood Drive",             file: "tanglewood",                size: "small" },
            { name: "42 Edgefield Road",              file: "edgefield",                 size: "small" },
            { name: "10 Ridgeview Court",             file: "ridgeview",                 size: "small" },
            { name: "Nell's Diner",                   file: "nells-diner",               size: "small" },
            { name: "Grafton Farmhouse",              file: "grafton",                   size: "small" },
            { name: "13 Willow Street",               file: "willow",                    size: "small" },
            { name: "Point Hope Restricted",          file: "point-hope-restricted",     size: "small" },
            { name: "Prison Restricted - F1",              file: "prison-restricted1",         size: "small" },
            { name: "Prison Restricted - F2",              file: "prison-restricted2",         size: "small" },
            { name: "Camp Woodwind",                  file: "camp-woodwind",             size: "small" },

            /* Medium */
            { name: "Point Hope",                     file: "point-hope",                size: "medium" },
            { name: "Brownstone High School Restricted - F1 Left", file: "brownstone-restricted1",  size: "medium" },
            { name: "Brownstone High School Restricted - F1 Right", file: "brownstone-restricted2",  size: "medium" },
            { name: "Brownstone High School Restricted - F2 Left", file: "brownstone-restricted3",  size: "medium" },
            { name: "Brownstone High School Restricted - F2 Right", file: "brownstone-restricted4",  size: "medium" },
            { name: "Bleasdale Farmhouse",            file: "bleasdale",                 size: "medium" },
            { name: "Sunny Meadows Restricted - Courtyard",       file: "sunny-meadows-restricted1",  size: "medium" },
            { name: "Sunny Meadows Restricted - Female Wing",       file: "sunny-meadows-restricted2",  size: "medium" },
            { name: "Sunny Meadows Restricted - Hospital",       file: "sunny-meadows-restricted3",  size: "medium" },
            { name: "Sunny Meadows Restricted - Male Wing",       file: "sunny-meadows-restricted4",  size: "medium" },
            { name: "Sunny Meadows Restricted - Basement",       file: "sunny-meadows-restricted5",  size: "medium" },
            { name: "Prison",                         file: "prison",                    size: "medium" },
            { name: "Maple Lodge Campsite",           file: "maple-lodge",               size: "medium" },

            /* Large */
            { name: "Brownstone High School",         file: "brownstone",                size: "large" },
            { name: "Sunny Meadows",                  file: "sunny-meadows",             size: "large" }
        ];

        const SIZE_TITLES = { small: "MAŁE MAPY", medium: "ŚREDNIE MAPY", large: "DUŻE MAPY" };


        /* ==========================================================================
           HELPERS & STATE
           ========================================================================== */

        const $ = id => document.getElementById(id);
        const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

        const viewer = $("viewer");
        const image = $("map-image");
        const message = $("viewer-message");

        let currentIndex = -1;
        let loadToken = 0;                           // ignores late answers from older loads
        const view = { scale: 1, fit: 1, x: 0, y: 0 };


        /* ==========================================================================
           PICKING A MAP
           ========================================================================== */

        function buildPicker() {
            let html = "";
            let lastSize = "";

            MAPS.forEach((map, index) => {
                if (map.size !== lastSize) {                 // new group heading
                    const count = MAPS.filter(item => item.size === map.size).length;
                    html += `<div class="map-group-title">${SIZE_TITLES[map.size]} · ${count}</div>`;
                    lastSize = map.size;
                }
                html += `<button class="map-btn" data-index="${index}">` +
                        `<small>${String(index + 1).padStart(2, "0")}</small>${map.name}</button>`;
            });

            $("map-picker").innerHTML = html;
        }

        function selectMap(index) {
            const map = MAPS[index];
            if (!map) return;

            currentIndex = index;
            $("map-title").textContent = map.name;
            [...document.querySelectorAll(".map-btn")].forEach((button, i) =>
                button.classList.toggle("active", i === index));

            history.replaceState(null, "", "#" + map.file);
            try { localStorage.setItem("gl-map", map.file); } catch (error) { /* storage blocked */ }

            loadImage(map);
        }

        /* Tries each file extension in turn until one exists. */
        function loadImage(map) {
            const token = ++loadToken;
            let attempt = 0;

            image.hidden = true;
            showMessage(`<em>⏳</em>Ładowanie mapy…`);

            const tryNext = () => {
                if (token !== loadToken) return;
                if (attempt >= IMAGE_EXTENSIONS.length) {
                    showMessage(`<em>📁</em>Nie znaleziono zdjęcia dla: <b>${map.name}</b><br>` +
                                `Wrzuć plik jako <b>${IMAGE_FOLDER}${map.file}.jpg</b> (lub .png / .webp)`);
                    return;
                }
                image.src = `${IMAGE_FOLDER}${map.file}.${IMAGE_EXTENSIONS[attempt++]}`;
            };

            image.onerror = tryNext;
            image.onload = () => {
                if (token !== loadToken) return;
                image.alt = map.name;
                message.hidden = true;
                image.hidden = false;
                fitToWindow();
            };
            tryNext();
        }

        function showMessage(html) {
            message.innerHTML = html;
            message.hidden = false;
        }


        /* ==========================================================================
           ZOOM & PAN
           ========================================================================== */

        function applyView() {
            image.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.scale})`;
            $("zoom-label").textContent = Math.round((view.scale / view.fit) * 100) + "%";
        }

        /* Fits the whole map inside the window and centres it. */
        function fitToWindow() {
            if (image.hidden || !image.naturalWidth) return;
            const box = viewer.getBoundingClientRect();
            view.fit = Math.min(box.width / image.naturalWidth, box.height / image.naturalHeight);
            view.scale = view.fit;
            view.x = (box.width - image.naturalWidth * view.scale) / 2;
            view.y = (box.height - image.naturalHeight * view.scale) / 2;
            applyView();
        }

        /* Zooms around a point (cx, cy) measured from the viewer's top-left corner. */
        function zoomAt(factor, cx, cy) {
            if (image.hidden) return;
            const newScale = clamp(view.scale * factor, view.fit * 0.5, view.fit * 10);
            const ratio = newScale / view.scale;
            view.x = cx - (cx - view.x) * ratio;
            view.y = cy - (cy - view.y) * ratio;
            view.scale = newScale;
            applyView();
        }

        function zoomFromCentre(factor) {
            const box = viewer.getBoundingClientRect();
            zoomAt(factor, box.width / 2, box.height / 2);
        }

        function bindViewer() {
            viewer.addEventListener("wheel", event => {
                event.preventDefault();
                const box = viewer.getBoundingClientRect();
                zoomAt(event.deltaY < 0 ? 1.15 : 1 / 1.15, event.clientX - box.left, event.clientY - box.top);
            }, { passive: false });

            let drag = null;
            viewer.addEventListener("pointerdown", event => {
                if (image.hidden) return;
                drag = { x: event.clientX - view.x, y: event.clientY - view.y };
                viewer.setPointerCapture(event.pointerId);
                viewer.classList.add("dragging");
            });
            viewer.addEventListener("pointermove", event => {
                if (!drag) return;
                view.x = event.clientX - drag.x;
                view.y = event.clientY - drag.y;
                applyView();
            });
            const stopDrag = () => { drag = null; viewer.classList.remove("dragging"); };
            viewer.addEventListener("pointerup", stopDrag);
            viewer.addEventListener("pointercancel", stopDrag);

            viewer.addEventListener("dblclick", event => {
                const box = viewer.getBoundingClientRect();
                zoomAt(2, event.clientX - box.left, event.clientY - box.top);
            });

            $("zoom-in").addEventListener("click", () => zoomFromCentre(1.3));
            $("zoom-out").addEventListener("click", () => zoomFromCentre(1 / 1.3));
            $("zoom-fit").addEventListener("click", fitToWindow);
            $("fullscreen").addEventListener("click", () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else viewer.requestFullscreen?.();
            });

            document.addEventListener("fullscreenchange", () => setTimeout(fitToWindow, 100));
            addEventListener("resize", fitToWindow);
        }


        /* ==========================================================================
           START-UP
           ========================================================================== */

        function init() {
            buildPicker();
            bindViewer();

            $("map-picker").addEventListener("click", event => {
                const button = event.target.closest(".map-btn");
                if (button) selectMap(Number(button.dataset.index));
            });

            document.addEventListener("keydown", event => {
                if (event.ctrlKey || event.metaKey || event.altKey) return;
                if (event.key === "ArrowRight") selectMap((currentIndex + 1) % MAPS.length);
                else if (event.key === "ArrowLeft") selectMap((currentIndex - 1 + MAPS.length) % MAPS.length);
                else if (event.key === "+" || event.key === "=") zoomFromCentre(1.3);
                else if (event.key === "-") zoomFromCentre(1 / 1.3);
                else if (event.key === "0") fitToWindow();
            });

            /* Open the map from the link (maps.html#prison) or the last one you looked at. */
            let remembered = "";
            try { remembered = localStorage.getItem("gl-map") || ""; } catch (error) { /* storage blocked */ }
            const wanted = location.hash.slice(1) || remembered;
            const index = MAPS.findIndex(map => map.file === wanted);
            if (index >= 0) selectMap(index);
        }

        init();
    </script>
    <script>
        /* "MINI-ODTWARZACZ": sends the current map to the floating player on the main page */
        (function () {
            const button = document.getElementById("mini-send");
            button.addEventListener("click", () => {
                if (currentIndex < 0) {                                   // no map chosen yet
                    button.textContent = "Najpierw wybierz mapę";
                    setTimeout(() => { button.textContent = "⧉ MINI-ODTWARZACZ"; }, 1500);
                    return;
                }
                let state = {};
                try { state = JSON.parse(localStorage.getItem("gl-mini") || "{}"); } catch (error) { /* ignore */ }
                state.open = true;
                state.file = MAPS[currentIndex].file;
                try { localStorage.setItem("gl-mini", JSON.stringify(state)); } catch (error) { /* ignore */ }
                location.href = "index.html#mini=" + encodeURIComponent(MAPS[currentIndex].file);
            });
        })();
    </script>
</body>
</html>
